---

# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  go: '1.26.2'

output:
  formats:
    # text:
    #   path: 'stdout'
    #   print-linter-name: false
    #   print-issued-lines: true
    #   colors: true
    # json:
    #   path: 'stdout'
    tab:
      path: 'stdout'
      print-linter-name: true
      colors: true

  sort-order:
    - file
    - severity
    # - linter

severity:
  default: error
  rules:
  # - linters:
  #     - unused
  #     - errcheck
  #   severity: warning

linters:
  # these will be checked in the warn-only run as warnings will also be a failure:
  #   https://github.com/golangci/golangci-lint/issues/1981
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000  # should have a package comment
        - -ST1020  # comment on exported function
        - -ST1021  # comment on exported type
        - -ST1022  # comment on exported const
        - -ST1003  # var casing
        - -QF1001  # Exclude "Apply De Morgan's law"
        - -QF1008  # could remove embedded field
  exclusions:
    rules:
      - path: \.go
        linters:
          - errcheck
          - unused  # todo: change after initial setup..
